services:
  app:
    image: garden-rhythm:alpha
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-8}
      GARDEN_SINGLE_USER_KEY: ${GARDEN_SINGLE_USER_KEY:-garden-owner}
      GARDEN_SINGLE_USER_NAME: ${GARDEN_SINGLE_USER_NAME:-Садовод}
      GARDEN_PUBLIC_HOST: ${GARDEN_PUBLIC_HOST}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "8000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      GARDEN_PUBLIC_HOST: ${GARDEN_PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
